<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Farm</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F4F1E8;--card:#fff;--ink:#1F3A2E;--mute:#7C8579;--chip:#fff;--chipOn:#1F3A2E;--chipOnInk:#fff;--tint:#DDEBD6;--line:#E6E2D3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171C18;--card:#222A24;--ink:#EAF1E6;--mute:#93A08F;--chip:#222A24;--chipOn:#DDEBD6;--chipOnInk:#1F3A2E;--tint:#2C3A2E;--line:#303A32}}
:root[data-theme="dark"]{--bg:#171C18;--card:#222A24;--ink:#EAF1E6;--mute:#93A08F;--chip:#222A24;--chipOn:#DDEBD6;--chipOnInk:#1F3A2E;--tint:#2C3A2E;--line:#303A32}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:20px 18px 104px;position:relative}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.loc{font-size:13px;color:var(--mute);margin-top:4px;display:flex;gap:5px;align-items:center}
.rb{width:44px;height:44px;border-radius:50%;background:var(--card);border:0;font-size:20px;box-shadow:0 1px 6px rgba(40,50,30,.08);color:var(--ink);cursor:pointer}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 14px inherit;font-family:inherit;padding:12px 18px;border-radius:99px;display:flex;gap:8px;align-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(40,50,30,.06)}
.chip.on{background:var(--chipOn);color:var(--chipOnInk)}
.map{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 2px 10px rgba(40,50,30,.1)}
.map svg{display:block;width:100%;height:auto;will-change:transform;transform-origin:0 0}
.map .z{cursor:pointer}
.xp{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#1F3A2E;font-size:16px;cursor:pointer}
.hint{margin-top:16px;background:var(--tint);border-radius:20px;padding:18px;display:flex;gap:14px;align-items:center}
.hint b{display:block;font-size:15px}.hint span{font-size:13px;color:var(--mute)}
.card{margin-top:16px;background:var(--card);border-radius:22px;padding:16px;box-shadow:0 1px 8px rgba(40,50,30,.06)}
.hd{display:flex;gap:14px;align-items:center}
.ico{width:56px;height:56px;border-radius:18px;background:var(--tint);display:grid;place-items:center;font-size:26px;flex:none}
.hd h3{font-size:17px;font-weight:700}.hd p{font-size:13px;color:var(--mute);margin-top:2px}
.badge{margin-left:auto;font-size:12px;font-weight:600;background:var(--tint);padding:8px 12px;border-radius:99px;white-space:nowrap}
.gr{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:16px 0 8px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:#3C8A4C;border-radius:9px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.st div{background:var(--bg);border-radius:14px;padding:11px 12px}.st small{display:block;font-size:11px;color:var(--mute)}.st b{font-size:13.5px}
h2{font-size:18px;font-weight:700;margin:24px 0 4px}
.sub{font-size:13px;color:var(--mute)}
.lnk{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);color:var(--ink);font-family:inherit;text-align:left;border-radius:18px;padding:12px;margin-top:10px;cursor:pointer;box-shadow:0 1px 6px rgba(40,50,30,.05)}
.lnk .ico{width:46px;height:46px;border-radius:15px;font-size:22px}.lnk b{display:block;font-size:14.5px}.lnk span{font-size:12.5px;color:var(--mute)}.lnk em{margin-left:auto;color:var(--mute);font-style:normal;font-size:20px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:none;color:var(--mute);font:500 11.5px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 10px;cursor:pointer}
nav button.on{color:var(--ink);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .on svg{fill:currentColor;fill-opacity:.9}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;margin-bottom:14px}
.top b{display:block;font-size:17px}.top span{font-size:12.5px;color:var(--mute)}
.back{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 1px 6px rgba(40,50,30,.08)}
.feed{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.feed small{background:var(--bg);padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mute)}
.tl{display:flex;align-items:flex-start;margin-top:16px}
.tl>div{flex:1;text-align:center;position:relative;font-size:12px}
.tl .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--line);background:var(--card);position:relative;z-index:1;display:grid;place-items:center;color:#fff;font-size:13px}
.tl .done .dot{background:#2E6B45;border-color:#2E6B45}
.tl>div:not(:last-child):after{content:"";position:absolute;top:12px;left:calc(50% + 15px);right:calc(-50% + 15px);height:2px;background:var(--line)}
.tl .done:not(:last-child):after{background:#2E6B45}
.tl b{display:block;font-size:14px;margin-bottom:3px}.tl .t{color:var(--mute);margin-top:2px}.tl .up{color:#B7791F;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.cat{border:2px solid transparent;background:var(--card);color:var(--ink);font-family:inherit;border-radius:20px;padding:12px 4px;text-align:center;cursor:pointer;box-shadow:0 1px 6px rgba(40,50,30,.05)}
.cat.on{border-color:#2E6B45}.cat i{display:block;font-style:normal;font-size:32px;margin-bottom:4px}.cat b{display:block;font-size:19px}.cat span{font-size:11.5px;color:var(--mute)}
.an{display:flex;gap:14px;align-items:center;margin-top:10px;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 1px 6px rgba(40,50,30,.05)}
.an .ico{width:64px;height:64px;font-size:32px;border-radius:16px}
.an h4{font-size:16px}.an p{font-size:12.5px;color:var(--mute);margin:2px 0 7px}
.tg{display:flex;gap:6px;flex-wrap:wrap}.tg span{font-size:11px;background:var(--bg);padding:4px 9px;border-radius:9px;color:var(--mute);font-weight:600}
.hp{margin-left:auto;align-self:flex-start;font-size:12px;font-weight:600;background:var(--tint);padding:6px 10px;border-radius:99px}
.btn{width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px;font:700 14.5px inherit;font-family:inherit;background:var(--tint);color:var(--ink);cursor:pointer}
.btn.pri{background:#2E6B45;color:#fff}.btn.off{opacity:.45;pointer-events:none}.btn.sm{width:auto;margin:0 0 0 auto;padding:10px 14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coin{background:var(--card);border-radius:99px;padding:11px 16px;font-weight:700;font-size:14px;box-shadow:0 1px 6px rgba(40,50,30,.08)}
.rn{margin-left:6px;flex:none;width:32px;height:32px;border:0;border-radius:50%;background:var(--bg);color:var(--mute);font-size:14px;cursor:pointer}
.lnk.off{opacity:.45;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:#1F3A2E;color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:9;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.log{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.map .z:active{opacity:.85}.map{isolation:isolate}
@media(prefers-reduced-motion:no-preference){@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#stock,#home,#harv{animation:vin .35s ease both}#info.ani>*{animation:vin .45s .1s ease both}.chip,.cat,.lnk{transition:transform .12s}.chip:active,.cat:active,.lnk:active{transform:scale(.97)}}
.auth{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:430px;margin:0 auto}
.auth h2{font-size:22px;margin-bottom:4px}.auth .sub{margin-bottom:18px}
.auth input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;margin-bottom:10px}
.auth .err{color:#B4462F;font-size:13px;min-height:18px}
.auth[hidden]{display:none}
.auth .btn{margin-top:6px}
</style>
</head>
<body>
<div class="app">
 <div id="farm">
  <header><div><h1>My Farm</h1><div class="loc">📍 <span id="locFarm">Kebun Kita · 12.5 ha</span></div></div><div class="coin" id="coin"></div></header>
  <div class="chips" id="chips"></div>
  <div class="map" id="map"></div>
  <div id="info"></div>
 </div>
 <div id="home" hidden></div><div id="harv" hidden></div>
 <div id="stock" hidden>
  <div class="top"><button class="back" id="back" aria-label="Back">←</button><div><b>Livestock</b><span id="locStock">Kebun Kita</span></div></div>
  <div class="card" style="margin-top:0">
   <div class="feed">🌾 Today's feeding <small id="fc"></small></div>
   <div class="tl" id="tl"></div>
  </div>
  <button class="btn" id="feedbtn" data-a="feed"></button>
  <h2>Categories</h2><p class="sub">Tap a group to see its animals</p>
  <div class="cats" id="cats"></div>
  <h2 id="lt">Your cows</h2><p class="sub" id="ls"></p>
  <div id="list"></div>
 </div>
</div>
<div class="auth" id="auth" hidden>
 <h2>🌱 Kebun Berdua</h2><p class="sub">Login akun kebun kamu</p>
 <input id="authMail" type="email" placeholder="Email" autocomplete="username">
 <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
 <div class="err" id="authErr"></div>
 <button class="btn pri" id="authBtn">Masuk</button>
</div>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>

<script>
const $=s=>document.querySelector(s);
const sb=window.supabase.createClient('https://nnvauxgeskejzmzenbkn.supabase.co','sb_publishable_FjXQhNdL_TjifvXXfB_T4A_RH7kDD3G');
const ZONE={tomato:'tomat',veg:'sayur',corn:'jagung'};

${RG('canG',[.35,.3,.85],[[0,'#7BC85E'],[.6,'#4C9A3C'],[1,'#2F7430']])}${RG('metalG',[.35,.3,.9],[[0,'#F4F7F8'],[.6,'#CBD2D6'],[1,'#8E99A0']])}
${RG('baleG',[.35,.3,.9],[[0,'#F6DD7A'],[.6,'#E3BE4E'],[1,'#C9A53A']])}${RG('shdG',[.5,.5,.5],[[0,'#000',.4],[1,'#000',0]])}
${LG('dirtG',0,1,[[0,'#DDD0A8'],[1,'#CDBE92']])}${LG('mroofG',0,1,[[0,'#8FA3B5'],[1,'#566B7E']])}${LG('redT',1,0,[[0,'#EC6044'],[.5,'#D8442B'],[1,'#B8321E']])}${LG('woodG',0,1,[[0,'#D8A862'],[1,'#B98A4E']])}${LG('rfT',0,1,[[0,'#EE8F6C'],[1,'#D96A4A']])}${LG('rfB',0,1,[[0,'#B84A32'],[1,'#963822']])}${LG('rfS',1,0,[[0,'#D0603F'],[1,'#BE5236']])}
<pattern id="shing" width="6" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H6" stroke="#000" stroke-opacity=".16" stroke-width=".8"/></pattern>
<pattern id="gravel" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#A8966A"/><circle cx="6.5" cy="5" r=".7" fill="#EDE2C0"/><circle cx="4" cy="8" r=".6" fill="#B9A878"/></pattern>

 $('#home').innerHTML=`<header><div><h1>Hello, farmers 👋</h1><div class="loc">${S.fname}</div></div><div class="coin">🪙 ${S.coins}</div></header><div class="hint"><div style="font-size:26px">📋</div><div><b>${T.length?T.length+' tasks today':'All done for today'}</b><span>${T.length?'Tap one to get started':'Come back later to harvest'}</span></div></div><h2>Today</h2>`+T.map(t=>`<button class="lnk" data-g="${t[0]}"><div class="ico">${t[1]}</div><div><b>${t[2]}</b><span>${t[3]}</span></div><em>›</em></button>`).join('')+`<h2>Activity</h2>`+S.log.map(l=>`<div class="log">${l}</div>`).join('')}
function show(v){['farm','stock','home','harv'].forEach(x=>$('#'+x).hidden=x!==v);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='stock'?'farm':v)));
 if(v==='stock'){cat(catK);rtl()}if(v==='home')home();if(v==='harv')harv();if(v==='farm')go(cur);scrollTo(0,0)}
document.addEventListener('click',e=>{
 const n=e.target.closest('nav button');if(n){const v=n.dataset.v;if(v==='analytics'||v==='profile')toast('Coming in v2');else show(v);return}
 const a=e.target.closest('[data-a]');if(a){if(!a.classList.contains('off'))act(a.dataset.a,a.dataset.f);return}
 const sh=e.target.closest('[data-shop]');if(sh){shop(sh.dataset.shop);return}
 const jg=e.target.closest('[data-g]');if(jg){show('farm');go(jg.dataset.g);return}
 const c=e.target.closest('[data-k]');if(c){go(c.dataset.k,1);return}
 const z=e.target.closest('[data-z]');if(z){go(z.dataset.z,1);return}
 const rn=e.target.closest('[data-rename]');
 if(rn){const cur=rn.closest('.an').querySelector('h4').textContent;
  const v=(prompt('Rename animal:',cur)||'').trim().slice(0,30);
  if(v&&v!==cur){rn.disabled=true;
   sb.from('animals').update({name:v}).eq('id',rn.dataset.rename).eq('farm_id',S.fid).then(({error})=>{rn.disabled=false;
    if(error)toast('⚠️ '+error.message);else load()})}
  return}
 const t=e.target.closest('[data-c]');if(t){cat(t.dataset.c)}
});
$('#back').onclick=()=>show('farm');
const ic={Home:'<path d="M4 11l8-7 8 7v9H4z"/>',Farm:'<path d="M12 3c4 0 6 3 5 6 2 1 2 5-1 6h-3v6h-2v-6H8c-3-1-3-5-1-6-1-3 1-6 5-6z"/>',Analytics:'<path d="M5 20V12M12 20V5M19 20v-6"/>',Harvest:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',Profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
$('#nav').innerHTML=Object.entries(ic).map(([n,p])=>`<button data-v="${n==='Farm'?'farm':n==='Home'?'home':n==='Harvest'?'harv':n.toLowerCase()}" class="${n==='Farm'?'on':''}"><svg viewBox="0 0 24 24">${p}</svg>${n}</button>`).join('');
async function load(){
 const{data:{user}}=await sb.auth.getUser();if(!user)return;
 const pr=(await sb.from('profiles').select('farm_id').eq('id',user.id).maybeSingle()).data;
 if(!pr){$('#auth').hidden=false;$('#authErr').textContent='Akun ini belum punya kebun';return}
 S.fid=pr.farm_id;
 const[fm,pl,an,iv,lg]=await Promise.all([
  sb.from('farms').select('coins,name').eq('id',S.fid).single(),
  sb.from('plots').select('zone,crop_type,planted_at,last_watered_at'),
  sb.from('animals').select('id,type,name,last_fed_at'),
  sb.from('inventory').select('item,qty'),
  sb.from('activity_log').select('action,detail').order('created_at',{descending:true}).limit(6)]);
 if(fm.data){S.coins=fm.data.coins;S.fname=fm.data.name}
 $('#locFarm').textContent=S.fname+' · 12.5 ha';
 const ls=$('#locStock');if(ls)ls.textContent=S.fname;
 const now=new Date(),today=now.toDateString();
 for(const key in S.f){const z=ZONE[key],rows=(pl.data||[]).filter(r=>r.zone===z);
  if(!rows.length){S.f[key]=null;continue}
  const prw=rows.filter(r=>r.planted_at);
  if(!prw.length){S.f[key]={g:0,w:0,p:0};continue}
  const g=Math.round(prw.reduce((s,r)=>s+Math.min(100,(now-new Date(r.planted_at))/36e5/GROW*100),0)/prw.length);
  S.f[key]={g,w:prw.every(r=>r.last_watered_at&&new Date(r.last_watered_at).toDateString()===today)?1:0,
   p:new Date(Math.min(...prw.map(r=>+new Date(r.planted_at))))}}
 const fed=an.data||[],last=fed.length?Math.min(...fed.map(r=>new Date(r.last_fed_at).getTime())):0;
 S.fed=[6,12,18].map(h=>{const t=new Date();t.setHours(h,0,0,0);return now>=t&&last>=t.getTime()?1:0});
 S.inv={};(iv.data||[]).forEach(r=>S.inv[r.item]=r.qty);
 S.log=(lg.data||[]).map(r=>r.action+' '+r.detail);
 buildA(fed);coin();
 await applyEvent();
 if(!$('#stock').hidden){cat(catK);rtl()}else if(!$('#harv').hidden)harv();else if(!$('#home').hidden)home();else go(cur)}
async function applyEvent(){const day=new Date().toDateString();
 if(S.evDay===day)return;S.evDay=day;
 let h=0;const s=(S.fid||'')+day;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
 const e=h%10,ev=e<3?'🌧️':e<5?'🦗':e===5?'🍀':''; // ponytail: 30% hujan, 20% hama, 10% bonus; seeded per farm+day, idempotency via activity_log
 if(!ev)return;
 const st=new Date();st.setHours(0,0,0,0);
 const{data:ex}=await sb.from('activity_log').select('id').eq('farm_id',S.fid).eq('action',ev).gte('created_at',st.toISOString()).limit(1);
 if(ex&&ex.length)return;
 if(ev==='🌧️'){await sb.from('plots').update({last_watered_at:new Date().toISOString()}).eq('farm_id',S.fid).not('planted_at','is',null);
  Object.values(S.f).forEach(f=>{if(f&&f.p)f.w=1});
  await logact('🌧️','Hujan — semua tanaman tersiram');S.log.unshift('🌧️ Hujan — semua tanaman tersiram');toast('🌧️ Hujan! Tanaman tersiram gratis')}
 else if(ev==='🦗'){await sb.from('plots').update({last_watered_at:new Date(Date.now()-864e5).toISOString()}).eq('farm_id',S.fid).not('planted_at','is',null);
  Object.values(S.f).forEach(f=>{if(f&&f.p)f.w=0});
  await logact('🦗','Hama — tanaman perlu disiram ulang');S.log.unshift('🦗 Hama — tanaman perlu disiram ulang');toast('🦗 Hama menyerang! Siram ulang hari ini')}
 else{await sb.from('farms').update({coins:S.coins+15}).eq('id',S.fid);S.coins+=15;coin();
  await logact('🍀','Panen melimpah +15 🪙');S.log.unshift('🍀 Panen melimpah +15 🪙');toast('🍀 Panen melimpah +15 🪙')}}
async function boot(){const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#auth').hidden=false;return}
 $('#auth').hidden=true;await load()}
$('#authBtn').onclick=async()=>{$('#authErr').textContent='';
 const{error}=await sb.auth.signInWithPassword({email:$('#authMail').value.trim(),password:$('#authPass').value});
 if(error){$('#authErr').textContent=error.message||'Email atau password salah';return}
 $('#auth').hidden=true;
 try{await load();toast('✅ Login berhasil')}catch(e){toast('⚠️ Gagal memuat '+(e.message||e))}};
sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')$('#auth').hidden=false});
boot().catch(e=>{toast('⚠️ Gagal memuat '+(e.message||e))});
setInterval(()=>{if(document.visibilityState==='visible'&&$('#auth').hidden)load()},15000);
</script>
</body>
